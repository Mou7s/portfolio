title: 半导体企业级数字化综合运营管理平台
sort: 1
description: 面向半导体制造企业持续迭代的全栈业务平台，串联销售、财务、仓储与生产。内外贸报价支持多级审批、历史价格对比、低价预警、Excel 导入导出与月结报价财务汇总；销售交期预警和客户逾期应收查询帮助业务跟进交付与回款，审批流转通过企业微信应用消息通知。通过金蝶 K3Cloud WebAPI 对接库存与业务单据，通过 SQL Server 查询车间在制、工序计划及生产质量数据，并整合扫码出入库、库位管理与批次追溯。采用 Nuxt 4、Vue 3、Nuxt UI、TypeScript 与 Bun/Nitro 单体全栈架构，MySQL 承载业务数据、共享会话与缓存，以角色权限控制各业务模块的访问。
