about:
  title: "关于"
  description: |
    我的工程实践围绕两条互补的主线展开：一条是面向真实生产与运营场景的企业级全栈业务系统，另一条是运行在 Cloudflare 边缘节点上的低延迟原生 Web 产品。

    技术栈以 Bun、Nuxt 4、Vue 3 与 TypeScript 为核心——既能在单仓全栈架构中打通 MySQL、SQL Server、金蝶 K3Cloud 与企业微信协同，也能灵活组合 Durable Objects、D1、R2 与 Workers AI 构建流式与实时交互应用。在交付产品之外，我也在 GitHub 上持续沉淀数学、算法与 AI 协同工程规范的第一性原理笔记。

