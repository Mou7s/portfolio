faq:
  title: "常见问题"
  description: "关于技术选型、工程实践与合作方式的简要说明。"
  categories:
    - title: "技术与架构"
      questions:
        - label: "主要聚焦在哪些类型的项目开发？"
          content: |
            主要聚焦两类方向：一类是面向业务闭环的**企业数字化全栈系统**（如 ERP 集成、WMS 仓储、MES 质量看板与审批流程）；另一类是基于 **Cloudflare Workers** 生态的边缘原生产品（结合 D1、R2、KV、Durable Objects 与 Workers AI）。
        - label: "为什么主力采用 Bun + Nuxt 4 + Cloudflare？"
          content: |
            统一的 TypeScript 全栈模型让前端界面、Nitro 服务端路由、Zod 校验与定时任务在同一套工程标准下高效演进；搭配 Cloudflare 边缘基础设施，可以用极低的运维成本获得全球低延迟分发能力。
    - title: "工程与细节"
      questions:
        - label: "如何保障系统稳定性与 AI 辅助开发质量？"
          content: |
            在 `ctk-system`、`kingdee` 与 `meetnote` 等仓库中，我会通过显式的 `AGENTS.md` 工程契约、Zod 参数校验、Vitest / `workerd` 集成测试以及写操作 `dry-run` 门禁来约束代码与数据边界。
        - label: "交互体验与前端细节也会一并打磨吗？"
          content: |
            是的。从浅/暗双主题与 View Transitions 过渡动画，到 Plotly 3D 星图、Canvas 2D 实时棋盘与多语言日历视图，我更习惯从架构到界面细节一并打磨到位。
    - title: "联系与合作"
      questions:
        - label: "如何查看代码或进一步联系？"
          content: |
            欢迎浏览我的 [GitHub 仓库](https://github.com/Mou7s) 了解具体代码实现，或直接发送邮件至 [mou7s@icloud.com](mailto:mou7s@icloud.com) 与我沟通合作。
