title: Semiconductor Enterprise Digital Operations & Manufacturing Platform
sort: 1
description: A full-stack operations platform for a semiconductor manufacturer, connecting sales, finance, warehousing and production. Domestic and export quotations support multi-stage approval, historical price comparisons, low-price warnings, Excel import/export and monthly quotation reports. Delivery alerts and overdue receivables views help teams follow up on orders and payments, with workflow notifications sent through WeCom. Kingdee K3Cloud WebAPI connects inventory and business documents, while SQL Server supplies work-in-progress and manufacturing quality data. Built with Nuxt 4, Vue 3, Nuxt UI and TypeScript on Bun/Nitro, with MySQL for application data, shared sessions and caching, plus role-based access across business modules.
