about:
  title: "About"
  description: |
    I build end-to-end web software across two complementary worlds: production business systems for manufacturing operations and lightweight, edge-native applications on Cloudflare Workers.

    My stack centers on Bun, Nuxt 4, Vue 3, and TypeScript—whether connecting MySQL, SQL Server, Kingdee K3Cloud, and WeCom inside an open-source ERP monolith, or orchestrating Durable Objects, D1, R2, and Workers AI at the edge. Alongside shipping real products, I document first-principles self-study in mathematics, algorithms, and structured AI engineering workflows on GitHub.

