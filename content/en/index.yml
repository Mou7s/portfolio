faq:
  title: "FAQ"
  description: "Quick answers about how I build and collaborate."
  categories:
    - title: "Engineering"
      questions:
        - label: "What kind of software do you focus on?"
          content: |
            I focus on full-stack TypeScript web applications—spanning internal enterprise platforms (ERP/WMS/MES integration, multi-stage approvals, reporting) and edge-native tools running on Cloudflare Workers, D1, R2, and Durable Objects.
        - label: "Why Bun, Nuxt 4, and Cloudflare?"
          content: |
            A unified TypeScript codebase lets frontend interfaces, Nitro API routes, validation schemas, and background tasks move fast without extra glue layers. Pairing that with Cloudflare Workers keeps global latency and operational overhead low.
    - title: "Craft & Approach"
      questions:
        - label: "How do you approach reliability and AI-assisted development?"
          content: |
            Across repositories like `ctk-system`, `kingdee`, and `meetnote`, I pair explicit `AGENTS.md` engineering contracts with Zod validation, automated unit/workerd integration checks, and strict dry-run safeguards before any state mutation.
        - label: "Do you also handle interactive UI and end-to-end polish?"
          content: |
            Yes. From dual light/dark themes and View Transitions to Plotly 3D visualizations, Canvas 2D boards, and multi-locale calendars, I care about building interfaces that feel fast, coherent, and intuitive.
    - title: "Collaboration"
      questions:
        - label: "How can we get in touch?"
          content: |
            Explore my repositories on [GitHub](https://github.com/Mou7s) or reach out directly via [mou7s@icloud.com](mailto:mou7s@icloud.com).
